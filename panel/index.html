<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Panel · Terapia Respiratoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* Layout: una columna estrecha tipo ficha clínica; misma identidad que la landing (Cormorant Garamond + DM Sans, teal, cobre y crema). */
:root{
  --bg:#F8F3EA; --surface:#FFFDF9; --sunk:#EFE7D8; --ink:#1C2628; --muted:#5F6B6C; --line:rgba(13,59,62,.16);
  --accent:#14545A; --accent-ink:#F8F3EA; --accent-soft:#DCE8E6;
  --warn:#8A4B12; --warn-soft:#F6E3CF; --ok:#2E6B4A; --ok-soft:#DDEDE2; --violet:#AC5F38; --violet-soft:#F3E2D6;
  --f-display:"Cormorant Garamond",Georgia,serif;
  --f-body:"DM Sans",-apple-system,sans-serif;
  --f-mono:"DM Sans",-apple-system,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1B1C; --surface:#142526; --sunk:#10201F; --ink:#EDE6DA; --muted:#A3B0AE; --line:#2A3D3E;
  --accent:#6FB3AE; --accent-ink:#0B1718; --accent-soft:#1C3433;
  --warn:#E8A868; --warn-soft:#3A2817; --ok:#7CC79B; --ok-soft:#173022; --violet:#D89066; --violet-soft:#3A2A20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1B1C; --surface:#142526; --sunk:#10201F; --ink:#EDE6DA; --muted:#A3B0AE; --line:#2A3D3E;
  --accent:#6FB3AE; --accent-ink:#0B1718; --accent-soft:#1C3433;
  --warn:#E8A868; --warn-soft:#3A2817; --ok:#7CC79B; --ok-soft:#173022; --violet:#D89066; --violet-soft:#3A2A20; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:300 16px/1.65 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:740px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 11px/1.3 var(--f-body);letter-spacing:.28em;text-transform:uppercase;color:var(--violet)}

/* Cabecera */
.brand{padding-block:28px 18px;display:flex;flex-direction:column;gap:10px}
.brand h1{font-size:clamp(36px,7vw,52px);font-weight:500}
.brand p{margin:0;color:var(--muted);max-width:60ch}
.sig{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.sig b{font-family:var(--f-display);font-weight:600;font-size:15px}

/* Barra de módulos */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:baseline;gap:8px;border:1px solid var(--line);background:none;color:var(--muted);font:500 14px/1 var(--f-body);padding:10px 16px;border-radius:100px;cursor:pointer}
.tab .n{font:500 12px var(--f-mono)}
.tab .pc{font:500 11px var(--f-mono);color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--ink);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.tab[aria-selected="true"] .n{color:var(--accent)}
.tab.owner{color:var(--violet)}
.tab.owner[aria-selected="true"]{background:var(--violet-soft);border-color:color-mix(in srgb,var(--violet) 35%,transparent)}
.prog{height:3px;background:var(--sunk)}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}

/* Módulo */
.mod{padding-block:26px 64px;display:flex;flex-direction:column;gap:28px}
.mhead{display:flex;flex-direction:column;gap:8px}
.mhead h2{font-size:34px;font-weight:500}
.mhead p{margin:0;max-width:62ch}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--f-mono);padding:6px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.vio{background:var(--violet-soft);color:var(--violet)}

section.sec{display:flex;flex-direction:column;gap:18px;padding-top:22px;border-top:1px solid var(--line)}
.sec>header{display:flex;flex-direction:column;gap:4px}
.sec h3{font-size:24px;font-weight:500}
.sec .note{margin:0;color:var(--muted);font-size:14.5px;max-width:62ch}

.fld{display:flex;flex-direction:column;gap:6px;min-width:0;border:0;margin:0;padding:0}
.fld>label,.fld>legend{font-weight:500;font-size:15px;padding:0}
.help{font-size:13.5px;color:var(--muted);margin:0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;align-items:end}
.discs{border:0;padding:0;margin:4px 0 0;display:flex;flex-direction:column;gap:8px}
.discs legend{margin-bottom:8px}
.dopts{display:flex;flex-wrap:wrap;gap:6px}
.dopt{position:relative;cursor:pointer}
.dopt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.dopt span{display:inline-block;padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:500 14px var(--f-body)}
.dopt input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dopt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.alerta{padding:14px 16px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);font-weight:500}
.src{font-size:12.5px;color:var(--muted);font-style:italic;margin:0}
.isr{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r);background:var(--accent-soft);border:1px solid var(--line)}
.isr.none p{margin:0}
.isr .link{color:var(--accent);font-weight:600;text-decoration:none}
.isr-top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between}
.isr-n b{font:700 40px/1 var(--f-display)}
.isr-p{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.btn.wa{background:var(--ok);border-color:var(--ok);color:var(--surface);text-decoration:none}
.rowlab{font-weight:500;font-size:15px;margin-bottom:-8px}
input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{
  width:100%;font:16px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-height:46px}
textarea{min-height:90px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.unit{position:relative}
.unit input{padding-right:52px}
.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:500 13px var(--f-mono);color:var(--muted);pointer-events:none}

.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative;cursor:pointer}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:inline-block;font-weight:400;padding:10px 15px;border:1px solid var(--line);border-radius:100px;background:var(--surface);font-size:15px;line-height:1.2}
.opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.scale .opt span{min-width:42px;text-align:center;font-family:var(--f-mono)}
.lr{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.lr .side{font:500 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15px}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}

/* Test / video */
.test{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.test .th{display:flex;gap:12px;align-items:baseline}
.test .code{font:500 13px var(--f-mono);color:var(--accent);flex:0 0 auto}
.test h4{margin:0;font:600 17px/1.25 var(--f-display)}
.test ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.test .src{font-size:12.5px;color:var(--muted)}

/* Revisión */
.review{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:var(--r);background:var(--sunk);border:1px solid var(--line)}
.review h3{font-size:20px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:500 14px/1 var(--f-body);letter-spacing:.04em;padding:15px 26px;border-radius:100px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.vio{background:var(--violet);border-color:var(--violet);color:var(--surface)}
.btn.ghost{background:none}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:none}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}
.missing{margin:0;color:var(--warn);font-size:14.5px}
.out{width:100%;min-height:220px;font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--surface);white-space:pre-wrap}
.status{font-size:14px;color:var(--ok);min-height:1.4em;margin:0}
.howto{margin:0;font-size:14.5px;color:var(--muted)}

/* Panel */
.panel-intro{display:flex;flex-direction:column;gap:8px}
.import{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px dashed color-mix(in srgb,var(--violet) 50%,var(--line));border-radius:var(--r)}
.runners{display:flex;flex-direction:column;gap:16px}
.runner{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column}
.runner>.top{padding:16px;display:flex;flex-direction:column;gap:10px}
.runner .name{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between}
.runner .name h3{font-size:22px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kv div{background:var(--surface);padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv dt{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kv dd{margin:0;font:500 15px var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.runner .body{padding:4px 16px 16px;display:flex;flex-direction:column;gap:6px}
details{border-bottom:1px solid var(--line)}
details:last-child{border-bottom:0}
summary{cursor:pointer;padding:12px 0;font-weight:600;display:flex;gap:10px;align-items:baseline;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";font:500 14px var(--f-mono);color:var(--muted);width:12px}
details[open]>summary::before{content:"–"}
summary .d{font:400 13px var(--f-mono);color:var(--muted)}
.lines{margin:0 0 14px;font:13px/1.6 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.eval{display:flex;flex-direction:column;gap:12px;padding-bottom:14px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font:13px var(--f-mono);font-variant-numeric:tabular-nums;width:100%;min-width:520px}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-weight:500;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.empty{padding:24px;border-radius:var(--r);background:var(--sunk);color:var(--muted);font-size:15px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;margin-bottom:14px}
footer.foot{padding-block:24px 40px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.site{background:var(--surface);border-bottom:1px solid var(--line)}
.site .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px}
.logo{font:500 22px var(--f-display);color:var(--ink);text-decoration:none}.logo span{font-style:italic;color:var(--violet)}
.site small{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main.wrap{display:flex;flex-direction:column;gap:18px;padding-block:28px 64px}
.login{max-width:420px;margin:40px auto;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.login input,#busca{font:400 16px var(--f-body);padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.tools{display:flex;flex-direction:column;gap:10px}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.row2{display:flex;gap:8px}.row2 .btn{flex:0 0 auto;padding:12px 18px}
.btn.mini{padding:7px 12px;font-size:12.5px}
.contact{font-family:var(--f-mono);color:var(--ink)}
.status{font-size:13.5px;color:var(--accent);margin:0;min-height:1.3em}
details.import{padding:16px}details.import summary{cursor:pointer;font-weight:500}
details.import[open]{display:flex;flex-direction:column;gap:10px}
details summary .chip{margin-left:6px}
details>summary{flex-wrap:wrap;row-gap:6px}

</style>
</head>
<body>
<div class="site"><div class="wrap"><a class="logo" href="/">Terapia <span>Respiratoria</span></a><small id="who"></small></div></div>
<main class="wrap">
  <form class="login" id="login" hidden autocomplete="on">
    <span class="eyebrow">Acceso privado</span>
    <h2 style="font-size:32px">Panel de Rafael</h2>
    <label class="fld"><span style="font-weight:500">Correo</span><input id="lemail" type="email" autocomplete="username" required></label>
    <label class="fld"><span style="font-weight:500">Contraseña</span><input id="lpass" type="password" autocomplete="current-password" required></label>
    <button class="btn pri" id="lbtn" type="submit">Entrar</button>
    <p class="status" id="loginmsg" role="status"></p>
  </form>
  <div id="app" hidden>
    <div class="mhead" style="margin-bottom:16px"><span class="eyebrow">Solo visible para ti</span><h2>Panel de Rafael</h2>
      <p>Fichas y assessments de tu landing, guardados mientras la persona avanza. Los que no terminaron aparecen como «sin terminar», con su contacto si lo dejó.</p>
      <div class="actions"><button class="btn ghost mini" type="button" id="logout">Cerrar sesión</button></div></div>
    <section id="mod-panel"></section>
  </div>
</main>
<script>
(()=>{
/* ===== Esquema de la ficha deportiva (compartido entre la landing y el Panel de Rafael) =====
   Núcleo común + módulo por disciplina. Cada test indica su fuente en `src`. */
const YN=[['si','Sí'],['no','No']];
const PQ=['pq1','pq2','pq3','pq4','pq5','pq6','pq7'];
const DISCS=[
  ['running','Running'],['ciclismo','Ciclismo'],['natacion','Natación'],['triatlon','Triatlón'],
  ['futbol','Deportes de equipo'],['raqueta','Tenis / Pádel'],['fuerza','Fuerza / Gimnasio']
];
const DISC_LABEL=Object.fromEntries(DISCS);
const num=(id,l,u,x={})=>Object.assign({id,l,type:'number',u},x);
const seg=(id,l,o,x={})=>Object.assign({id,l,type:'seg',o},x);
const sel=(id,l,o,x={})=>Object.assign({id,l,type:'select',o},x);
const multi=(id,l,o,x={})=>Object.assign({id,l,type:'multi',o},x);
const txt=(id,l,x={})=>Object.assign({id,l,type:'text'},x);
const row=(f,l)=>({type:'row',f,l});
const test=(code,t,how,f,src)=>({type:'test',code,t,how,f,src});
const sent=id=>({id,l:'Video grabado y enviado',type:'check'});
const DIST=[['3','3 km'],['5','5 km'],['10','10 km'],['15','15 km'],['21.0975','Medio maratón'],['42.195','Maratón']];
const PLATF=[['garmin','Garmin Connect'],['strava','Strava'],['tp','TrainingPeaks'],['coros','Coros'],['polar','Polar'],['apple','Apple Salud'],['zwift','Zwift / rodillo'],['otra','Otra']];
const marks=(p,o)=>[1,2,3].map(i=>row([sel(`${p}${i}_d`,'Distancia',o),{id:`${p}${i}_t`,l:'Tiempo',type:'time'},{id:`${p}${i}_f`,l:'Fecha',type:'date'}],`Marca ${i}`));
const weeks=(p,l,u)=>row([num(p+'1','Hace 4 sem.',u),num(p+'2','Hace 3',u),num(p+'3','Hace 2',u),num(p+'4','La última',u)],l);

/* ---------- Bloques del núcleo ---------- */
const S_DATOS={t:'Tus datos',f:[
  txt('nombre','Nombre y apellido',{req:1}),
  row([num('edad','Edad','años',{min:12,max:99}),sel('sexo','Sexo',[['f','Femenino'],['m','Masculino']])]),
  row([num('peso','Peso','kg',{step:0.1}),num('talla','Talla','cm')]),
  row([txt('contacto','WhatsApp o correo'),txt('ciudad','Ciudad')])]};
const S_DISPON={t:'Disponibilidad',f:[
  multi('dias','Días en que puedes entrenar',[['lu','Lun'],['ma','Mar'],['mi','Mié'],['ju','Jue'],['vi','Vie'],['sa','Sáb'],['do','Dom']]),
  row([num('min_sem','Minutos por sesión entre semana','min'),num('min_fds','Minutos el fin de semana','min')]),
  seg('fuerza_hab','¿Haces trabajo de fuerza?',[['no','No'],['1','1 vez por semana'],['2','2 o más']])]};
const S_SALUD={t:'Salud',note:'Preguntas generales del cuestionario PAR-Q+. Un «sí» no te descarta: me dice qué revisar antes de pedirte esfuerzos máximos.',f:[
  seg('pq1','¿Algún médico te ha dicho que tienes una afección cardíaca o presión arterial alta?',YN),
  seg('pq2','¿Sientes dolor en el pecho en reposo, en tu día a día o al hacer actividad física?',YN),
  seg('pq3','¿Has perdido el equilibrio por mareo, o el conocimiento, en los últimos 12 meses?',YN,{help:'Responde «no» si el mareo fue por respirar muy rápido durante un esfuerzo intenso.'}),
  seg('pq4','¿Te han diagnosticado otra enfermedad crónica, distinta a la cardíaca o la presión alta?',YN),
  seg('pq5','¿Tomas medicamentos recetados para una enfermedad crónica?',YN),
  seg('pq6','¿Tienes, o tuviste en los últimos 12 meses, un problema de huesos, articulaciones, músculos, ligamentos o tendones que podría empeorar si aumentas tu actividad física?',YN,{help:'Responde «no» si fue en el pasado y hoy no te limita.'}),
  seg('pq7','¿Algún médico te ha dicho que solo debes hacer actividad física con supervisión médica?',YN),
  {id:'pq_detalle',l:'Cuéntame a cuál respondiste «sí» y qué te dijeron',type:'textarea',show:s=>PQ.some(k=>s[k]==='si')},
  multi('alarmas','¿Tienes hoy alguna de estas señales?',[['noche','Dolor en reposo o de noche que no cede'],['trauma','Golpe o caída fuerte reciente'],['peso','Pérdida de peso sin explicación'],['fiebre','Fiebre, escalofríos o sudores nocturnos'],['neuro','Debilidad u hormigueo que avanza en piernas o brazos'],['vejiga','Cambios al orinar'],['nada','Ninguna']],{src:'Walters y Cordoza, Rehab Science (señales de alarma)'})]};
const lesionRows=[1,2].map(i=>row([txt(`les${i}`,'Lesión o molestia',{ph:'Ej.: isquiotibial derecho'}),num(`les${i}_sem`,'Semanas sin entrenar','sem'),num(`les${i}_hoy`,'Dolor hoy (0–10)','',{min:0,max:10})],`Lesión ${i}`));
const S_LESION={t:'Lesiones de los últimos 12 meses',note:'Déjalo en blanco si no tuviste ninguna.',f:lesionRows};
const S_RESP={t:'Respiración',note:'Si no sabes alguna respuesta, déjala en blanco.',f:[
  {id:'isr',type:'isr'},
  multi('resp_sint','Al entrenar te pasa que…',[['disnea','Me falta el aire más de lo que debería'],['tos','Toso o me silba el pecho'],['garganta','Siento la garganta cerrada, «como respirar por un pitillo»'],['flato','Me da flato (dolor en el costado)'],['nariz','No puedo respirar por la nariz ni a ritmo suave'],['nada','Nada de esto']]),

  futbol:test('V6','Cambio de dirección',['Corre 5 m, frena y cambia de dirección hacia cada lado, de frente a la cámara.'],[sent('v6')]),
  raqueta:test('V6','Golpes',['Si alguien puede grabarte: 3 saques o remates y 3 golpes de fondo, de lado.'],[sent('v6')]),
  fuerza:test('V6','Tus básicos',['Una serie ligera de sentadilla y una de peso muerto (o bisagra de cadera), de perfil.'],[sent('v6')])};
function autoTests(d){
  const self=[...T_DICHARRY];
  if(['natacion','triatlon','raqueta','fuerza','futbol'].includes(d))self.push(...T_HOMBRO);
  if(d==='natacion')self.push(...T_NADO);
  if(['futbol','raqueta','fuerza'].includes(d))self.push(T_SALTO);
  if(['raqueta','fuerza'].includes(d))self.push(T_FLEX);
  const vids=[...V_BASE];
  if(['running','futbol','raqueta','triatlon'].includes(d))vids.splice(1,0,V_HOPS);
  if(['natacion','fuerza','raqueta'].includes(d))vids.push(V_OHS);
  vids.push(V_SPORT[d]);
  return {self,vids};
}

/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dec=n=>String(n).replace('.',',');
const parseT=s=>{if(!s)return null;const p=String(s).trim().split(':').map(Number);if(p.some(isNaN)||p.length<2||p.length>3)return null;return p.reduce((a,b)=>a*60+b,0)};
const fmtDate=v=>{if(!v)return '';const[y,m,d]=v.split('-');return `${d}/${m}/${y}`};
const fmtIso=iso=>{try{return new Date(iso).toLocaleDateString('es-VE',{day:'numeric',month:'short',year:'numeric'})}catch(e){return iso}};
const keyOf=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'sin-nombre';
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)};
const b64e=s=>{const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i++)o+=String.fromCharCode(b[i]);return btoa(o)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)));
function labelOf(o,v){const x=o&&o.find(a=>a[0]===v);return x?x[1]:v}
function valStr(f,d){
  const v=d[f.id];
  switch(f.type){
    case 'seg':case 'select':return v?labelOf(f.o,v):'';
    case 'multi':return Array.isArray(v)&&v.length?v.map(x=>labelOf(f.o,x)).join(', '):'';
    case 'lr':{const a=d[f.id+'_D'],b=d[f.id+'_I'];return (a||b)?`D ${a?labelOf(f.o,a):'—'} · I ${b?labelOf(f.o,b):'—'}`:''}
    case 'check':return v?'Sí':'';
    case 'number':return (v!==undefined&&v!=='')?`${dec(v)}${f.u?' '+f.u:''}`:'';
    case 'date':return fmtDate(v);
    default:return v?String(v):'';
  }
}
function visible(f,d){return !f.show||f.show(d)}
function summaryLines(m,d,sch){
  const out=[];
  (sch||SCHEMA)[m].sections.forEach(s=>{
    const lines=[];

async function inflate(b64){
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));

  return new TextDecoder().decode(buf);
}

}

  const evalForm=disc==='rehab'?rehabEval(g.key,ev,d):`<details data-dk="${esc(g.key)}:ev"><summary>Tu evaluación presencial</summary><div class="eval" data-eval="${esc(g.key)}">
      <p class="help">PIM/PEM: al menos 5 maniobras, mejor de 3 que no difieran más de 20 %; calentamiento previo de 2 × 30 respiraciones al 40 % de la mejor PIM inicial (McConnell, recuadro 6.3).</p>
      <div class="row">${evNum('pim','PIM','cmH₂O',ev)}${evNum('pem','PEM','cmH₂O',ev)}${evNum('slD','Sentadilla 1 pierna D','/6',ev)}${evNum('slI','Sentadilla 1 pierna I','/6',ev)}</div>
      <div class="row">${evSel('bil','Sentadilla bilateral',[['cadera','Dominante de cadera'],['rodilla','Dominante de rodilla']],ev)}${evSel('puente','Puente a una pierna',[['ok','Estable'],['cae','Cae o se desplaza la pelvis'],['isquio','Isquio o lumbar dominante']],ev)}</div>
      <div class="fld"><label for="ev-${esc(g.key)}-notas">Notas</label><textarea id="ev-${esc(g.key)}-notas" data-ev="notas">${esc(ev.notas||'')}</textarea></div>
      <div class="actions"><button class="btn vio" type="button" data-evsave="${esc(g.key)}">Guardar evaluación</button></div><p class="status" data-evst></p>
    </div></details>`;
  return `<article class="runner">
    <div class="top"><div class="name"><h3>${esc(g.name||'Sin nombre')}</h3><span class="meta">${prof?`<span class="chip vio">${prof.code} · ${esc(prof.label)}</span>`:''}<span class="chip">${esc(DISC_LABEL[disc]||disc)}</span></span></div>
      ${prof?`<p class="help" style="color:var(--ink)"><span class="eyebrow">Test sugerido</span><br>${esc(prof.test)} <span class="src">(${esc(prof.src)})</span>${prof.ergo?`<br><span class="eyebrow">Ergoespirometría</span> ${esc(ERGO_TXT[disc]||'')}`:''}</p>`:`<p class="help">Falta la ficha de ingreso.</p>`}
      ${extra}${fl.length?`<div class="meta">${fl.map(([c,t])=>`<span class="chip ${c}">${esc(t)}</span>`).join('')}</div>`:''}
      ${fl.some(([,t])=>/EILO|broncoespasmo/.test(t))?`<p class="help">Los síntomas por sí solos predicen mal el broncoespasmo; confirma con prueba objetiva antes de concluir (Dickinson y Hull).</p>`:''}
    </div>
    <dl class="kv" style="margin:0">${kv.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
    <div class="body">${evalForm}${ckTable}${recDetailsHtml(g)}</div>
  </article>`;
}

/* ---------- acciones ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-filtro]'); if(!t||!$('#mod-panel').contains(t))return;
  if(t.dataset.filtro){FILTRO=t.dataset.filtro;renderPanel();return}
  if(t.id==='recargar'){loadAll();return}
  if(t.id==='impbtn'){
    const txt=$('#imp').value, found=await parseCodes(txt);
    if(!found.length){importMsg='No encontré ningún código #RQ…#FIN# en el texto. Pega el mensaje completo.';$('#impst').textContent=importMsg;return}
    t.disabled=true; let ok=0;
    for(const {p,code} of found){
      const nombre=String(p.d.nombre||'').trim();
      try{await api('/rest/v1/rpc/guardar_registro',{method:'POST',body:JSON.stringify({p_session:'importado-'+p.t+'-'+hash(code)+'-'+code.length,p_tipo:'ficha',p_modulo:p.t,p_disciplina:validDisc(p.s),p_nombre:nombre,p_contacto:String(p.d.contacto||''),p_estado:'enviado',p_datos:Object.assign({},p,{pct:null,ult:null})})});ok++}catch(err){}
    }
    importMsg=ok===found.length?`Importada${ok>1?'s':''} ${ok} ficha${ok>1?'s':''}.`:`Importadas ${ok} de ${found.length}. Vuelve a intentar con las que faltan.`;
    $('#imp').value=''; t.disabled=false; await loadAll(); return;
  }
  if(t.dataset.del){confirmDel=t.dataset.del;renderPanel();return}
  if(t.dataset.delNo!==undefined){confirmDel=null;renderPanel();return}
  if(t.dataset.delYes){
    try{await api('/rest/v1/registros?session_id=eq.'+encodeURIComponent(t.dataset.delYes),{method:'DELETE',headers:{Prefer:'return=minimal'}});FICHAS=FICHAS.filter(r=>r.id!==t.dataset.delYes)}catch(err){setMsg('No se pudo borrar: '+err.message)}
    confirmDel=null; renderPanel(); return;
  }
  if(t.dataset.evsave){
    const key=t.dataset.evsave, box=t.closest('[data-eval]'), data={};
    $$('[data-ev]',box).forEach(i=>{if(i.value!=='')data[i.dataset.ev]=i.value});
    data.actualizado=new Date().toISOString();
    const old=EVALS[key]||{};
    if(old.sm6_dist&&data.sm6_dist&&old.sm6_dist!==data.sm6_dist){data.sm6_prev=old.sm6_dist;data.sm6_prev_f=old.actualizado||''}
    else if(old.sm6_prev){data.sm6_prev=old.sm6_prev;data.sm6_prev_f=old.sm6_prev_f||''}
    const st=$('[data-evst]',box); t.disabled=true;
    try{await api('/rest/v1/evaluaciones',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({persona:key,datos:data})});EVALS[key]=data;st.textContent='Evaluación guardada. Las anteriores quedan en el historial.';renderPanel()}
    catch(err){st.textContent='No se pudo guardar: '+err.message}
    t.disabled=false;
  }
});
document.addEventListener('input',e=>{if(e.target.id==='busca'){BUSCA=e.target.value;renderPanel()}});

/* ---------- inicio de sesión ---------- */
function showLogin(msg){
  $('#login').hidden=false; $('#app').hidden=true; $('#who').textContent='';
  const m=$('#loginmsg'); m.textContent=msg||'';
}
async function showApp(){
  $('#login').hidden=true; $('#app').hidden=false; $('#who').textContent=TOK&&TOK.email?TOK.email:'';
  renderPanel(); await loadAll();
}
$('#login').addEventListener('submit',async e=>{
  e.preventDefault();
  const email=$('#lemail').value.trim(), password=$('#lpass').value, b=$('#lbtn'), m=$('#loginmsg');
  if(!email||!password){m.textContent='Escribe tu correo y tu contraseña.';return}
  b.disabled=true; m.textContent='Entrando…';
  try{await authReq('password',{email,password}); $('#lpass').value=''; await showApp()}
  catch(err){m.textContent=/invalid/i.test(err.message)?'Correo o contraseña incorrectos.':'No pude entrar: '+err.message}
  b.disabled=false;
});
$('#logout').addEventListener('click',()=>{setTok(null);FICHAS=[];EVALS={};showLogin('Sesión cerrada.')});
setInterval(()=>{if(TOK&&!$('#app').hidden&&document.visibilityState==='visible')loadAll()},120000);
document.addEventListener('visibilitychange',()=>{if(TOK&&!$('#app').hidden&&document.visibilityState==='visible'&&(!lastLoad||Date.now()-lastLoad>30000))loadAll()});
TOK?showApp():showLogin('');

})();
</script>
